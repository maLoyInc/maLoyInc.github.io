<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>[PLACEHOLDER_NAME] — Creative Developer Portfolio</title>
  <meta name="description" content="[PLACEHOLDER_DESCRIPTION]" />

  <!--
    STAGE 2 NOTE:
    This file is the structural skeleton only.
    No visual design, no real content, no animation logic yet.
    Sections are marked with comments describing their future responsibility.
  -->

  <!-- Favicon (placeholder path, add real icon in assets/icons/ later) -->
  <link rel="icon" href="./assets/icons/favicon.ico" />

  <!--
    STAGE 3 ADDITION:
    Typography — design system typefaces (see css/style.css :root
    for the full type scale). Space Grotesk = display/headings,
    Inter = body/UI text, Space Mono = section labels & nav eyebrows
    (a small "developer" signature detail).
  -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&family=Space+Mono:wght@400;700&display=swap"
    rel="stylesheet"
  />

  <!-- Stylesheets: order matters (base -> responsive -> animations) -->
  <link rel="stylesheet" href="./css/style.css" />
  <link rel="stylesheet" href="./css/responsive.css" />
  <link rel="stylesheet" href="./css/animations.css" />
</head>
<body>

  <!-- ============================================
       NAVIGATION
       Responsibility: site-wide nav bar, logo mark,
       anchor links to sections, mobile menu toggle.
       Implemented in: js/navigation.js
  ============================================= -->
  <header id="navbar">
    <!-- Nav markup will be implemented in a later stage -->
  </header>

  <main>

    <!-- ============================================
         HERO
         Responsibility: primary landing section —
         greeting, name, title, intro, CTAs, socials,
         and the 3D neuron canvas.
         Implemented in: js/neuron.js, js/animations.js
    ============================================= -->
    <section id="hero" aria-label="Introduction">
      <!-- Hero content and <canvas> mount point added in a later stage -->
    </section>

    <!-- ============================================
         ABOUT
         Responsibility: short personal narrative,
         quick facts, portrait/placeholder image.
    ============================================= -->
    <section id="about" aria-label="About Me">
      <!-- About content added in a later stage -->
    </section>

    <!-- ============================================
         SKILLS
         Responsibility: grouped competency display.
         Data structure implemented in: js/projects.js
         (skills data may live in its own data file later)
    ============================================= -->
    <section id="skills" aria-label="Skills">
      <!-- Skills content added in a later stage -->
    </section>

    <!-- ============================================
         PROJECTS
         Responsibility: case-study style project cards.
         Implemented in: js/projects.js
    ============================================= -->
    <section id="projects" aria-label="Projects">
      <!-- Project cards rendered/added in a later stage -->
    </section>

    <!-- ============================================
         EXPERIENCE
         Responsibility: timeline of roles/milestones.
    ============================================= -->
    <section id="experience" aria-label="Experience">
      <!-- Experience timeline added in a later stage -->
    </section>

    <!-- ============================================
         SERVICES / WHAT I DO
         Responsibility: short list of offerings.
    ============================================= -->
    <section id="services" aria-label="What I Do">
      <!-- Services content added in a later stage -->
    </section>

    <!-- ============================================
         CONTACT
         Responsibility: direct contact CTAs.
         CORRECTION (per approved plan update):
         No backend-dependent form. Uses mailto/email
         and social link CTAs only.
         Implemented in: js/contact.js
    ============================================= -->
    <section id="contact" aria-label="Contact">
      <!-- Contact CTAs added in a later stage -->
    </section>

  </main>

  <!-- ============================================
       FOOTER
       Responsibility: copyright, back-to-top,
       secondary social links.
  ============================================= -->
  <footer id="site-footer">
    <!-- Footer content added in a later stage -->
  </footer>

  <!--
    THIRD-PARTY LIBRARIES (CDN)
    Prepared per architecture stage only — not yet used.
    No implementation logic depends on these until the
    3D Neuron and Animation stages.
  -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>

  <!--
    PROJECT SCRIPTS
    Classic script loading (no bundler, no type="module" needed).
    Load order: data/logic modules first, main.js last to orchestrate init.
  -->
  <script src="./js/navigation.js"></script>
  <script src="./js/animations.js"></script>
  <script src="./js/neuron.js"></script>
  <script src="./js/projects.js"></script>
  <script src="./js/contact.js"></script>
  <script src="./js/main.js"></script>

</body>
</html>
